<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pins corrigeren — (W)ETEN WAAR.</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.5 system-ui, sans-serif; color: #16382f; background: #e9e4d5; }
  header { padding: .9rem 1rem; background: #123029; color: #e9e4d5; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 1rem; font-weight: 600; letter-spacing: .04em; }
  header .hint { opacity: .75; font-size: .82rem; }
  #map { height: 62vh; }
  .panel { padding: 1rem; }
  button { font: inherit; padding: .55rem 1.1rem; border-radius: 20px; border: 1px solid #1a4d43;
           background: #1a4d43; color: #f4f1e6; cursor: pointer; }
  button.ghost { background: transparent; color: #1a4d43; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  textarea { width: 100%; height: 190px; margin-top: .8rem; font: 12px/1.5 ui-monospace, monospace;
             padding: .7rem; border: 1px solid #c9c0aa; border-radius: 8px; background: #f4f1e6; resize: vertical; }
  .count { font-weight: 600; }
  .leaflet-marker-icon.verplaatst { filter: hue-rotate(140deg) saturate(2); }
  .lbl { font: 600 11px/1 system-ui; color: #16382f; text-shadow: 0 0 3px #f4f1e6, 0 0 3px #f4f1e6; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Pins corrigeren</h1>
  <span class="hint">Sleep een pin naar de juiste plek. Klik op een pin voor de naam.</span>
</header>
<div id="map"></div>
<div class="panel">
  <p><span class="count" id="teller">0</span> pins verplaatst.
     <button id="kopieer" disabled>Kopieer de wijzigingen</button>
     <button class="ghost" id="reset">Begin opnieuw</button></p>
  <textarea id="uit" readonly placeholder="Zodra je een pin versleept verschijnt hier de uitvoer. Plak die terug in de chat."></textarea>
</div>
<script>
const bron = new URLSearchParams(location.search).get('bron') || '../index.html';
let plekken = [], verplaatst = {};

function parseerPlekken(html) {
  const start = html.indexOf('const places = [');
  const eind = html.indexOf('\n];', start);
  if (start < 0 || eind < 0) throw new Error('places-array niet gevonden in ' + bron);
  // Alleen data, geen scriptuitvoering: de array is een letterlijke waarde.
  return Function('"use strict";return (' + html.slice(start + 'const places = '.length, eind + 2) + ')')();
}

function toon(msg) {
  document.getElementById('uit').value = msg;
}

fetch(bron)
  .then(r => { if (!r.ok) throw new Error(r.status + ' bij ophalen van ' + bron); return r.text(); })
  .then(html => {
    plekken = parseerPlekken(html);
    start();
  })
  .catch(e => toon('Kon de plekken niet laden: ' + e.message +
    '\n\nOpen deze pagina via een webserver vanuit de repo, niet als los bestand.'));

function start() {
  const map = L.map('map').setView([52.3676, 4.9041], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

  const bounds = [];
  plekken.forEach(p => {
    const m = L.marker([p.lat, p.lng], { draggable: true, autoPan: true }).addTo(map);
    m.bindTooltip(p.name, { permanent: true, direction: 'right', className: 'lbl', offset: [8, 0] });
    m.on('dragend', () => {
      const ll = m.getLatLng();
      verplaatst[p.name] = [ +ll.lat.toFixed(5), +ll.lng.toFixed(5) ];
      m._icon.classList.add('verplaatst');
      ververs();
    });
    bounds.push([p.lat, p.lng]);
  });
  map.fitBounds(bounds, { padding: [40, 40] });
  toon('');
}

function ververs() {
  const n = Object.keys(verplaatst).length;
  document.getElementById('teller').textContent = n;
  document.getElementById('kopieer').disabled = n === 0;
  toon(JSON.stringify(verplaatst, null, 2));
}

document.getElementById('kopieer').onclick = () => {
  const t = document.getElementById('uit');
  t.select();
  navigator.clipboard.writeText(t.value).then(
    () => { const b = document.getElementById('kopieer'); b.textContent = 'Gekopieerd'; setTimeout(() => b.textContent = 'Kopieer de wijzigingen', 1500); },
    () => document.execCommand('copy')
  );
};
document.getElementById('reset').onclick = () => location.reload();
</script>
</body>
</html>
